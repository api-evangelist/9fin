aid: 9fin
name: 9FIN
description: >-
  9fin is an AI-native debt market intelligence and data platform for modern
  credit teams, covering leveraged finance, private credit, distressed debt,
  high yield bonds, leveraged loans, CLOs, structured credit, and asset-backed
  finance. Founded in 2016 and headquartered in London, 9fin unifies deep credit
  data, covenant and financial analysis, expert news and analysis, and AI-powered
  workflows (covenant analysis, earnings summaries, comparable analysis) in one
  interface. It powers credit teams at 350+ leading institutions - investment
  banks, asset managers, hedge funds, law firms, and advisors - and raised a
  $170M Series C at a $1.3B valuation. 9fin offers an API and Data Services for
  clients to access its data under agreement, but publishes no open public
  developer portal or API specification at this time.
